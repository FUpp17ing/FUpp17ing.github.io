				太阳高度角（solar elevation angle），地理学术语，是指对地球上的某个地点<span class='hover-link'>太阳光</span>入射方向和地平面的夹角。
				专业上讲，太阳高度角是指某地太阳光线与通过该地与地心相连的地表切面的夹角。当太阳高度角为90°时，<span class='hover-link'>太阳辐射强度</span>最大；太阳<span class='hover-link'>斜射</span>地面程度越大（即太阳高度角越小），太阳辐射强度就越小。 [1]
